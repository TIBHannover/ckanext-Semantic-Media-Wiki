name: Tests
on: 
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        include: # ckan-image see https://github.com/ckan/ckan-docker-base
          - ckan-version: "2.10"
            ckan-image: "2.10-py3.10"
            solr-image: "2.10-solr9"
          - ckan-version: "2.11"
            ckan-image: "2.11-py3.10"
            solr-image: "2.11-solr9"
      fail-fast: false

    runs-on: ubuntu-22.04
    container:
      image: ckan/ckan-dev:${{ matrix.ckan-image }}
      options: --user root
    services:
      solr:
        image: ckan/ckan-solr:${{ matrix.solr-image }}
      postgres:
        image: ckan/ckan-postgres-dev:${{ matrix.ckan-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
          image: redis:6

    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1

    steps:
    - uses: actions/checkout@v4

    - name: Install requirements
      # Install any extra requirements your extension has here (dev requirements, other extensions etc)
      run: |
        pip install --no-cache-dir -r requirements.txt
        pip install --no-cache-dir -r dev-requirements.txt
        pip install -e .
        # Replace default path to CKAN core config file with the one on the container
        sed -i -e 's/use = config:.*/use = config:\/srv\/app\/src\/ckan\/test-core.ini/' test.ini

    - name: Setup extension
      run: |
        ckan -c test.ini db init

    - name: Run tests
      run: pytest --ckan-ini=test.ini --cov=ckanext.semantic_media_wiki --disable-warnings ckanext/semantic_media_wiki/tests
